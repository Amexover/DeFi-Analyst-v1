services:
  - type: web
    name: defi-analyst-v1
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: UPSTREAM_TIMEOUT_SECONDS
        value: '10'
      - key: COINGECKO_DEMO_API_KEY
        sync: false
